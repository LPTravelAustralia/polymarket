<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Dashboard</title>
    <meta name="description" content="Live Polymarket prediction market dashboard">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .logo span {
            color: #00d4aa;
        }
        
        .subtitle {
            color: #888;
            font-size: 16px;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #00d4aa;
        }
        
        .stat-card .label {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }
        
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        
        .card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-box input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
        }
        
        .search-box input::placeholder {
            color: #666;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #00d4aa;
        }
        
        .btn {
            padding: 14px 28px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #00d4aa;
            color: #000;
        }
        
        .btn-primary:hover {
            background: #00f5c4;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-tab {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: #888;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .filter-tab:hover, .filter-tab.active {
            background: #00d4aa;
            color: #000;
        }
        
        .market-grid {
            display: grid;
            gap: 16px;
        }
        
        .market-item {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .market-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: #00d4aa;
            transform: translateY(-2px);
        }
        
        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .market-question {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.4;
            flex: 1;
        }
        
        .market-price {
            background: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
        }
        
        .market-stats {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: #888;
            flex-wrap: wrap;
        }
        
        .market-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .market-stats .value {
            color: #fff;
            font-weight: 500;
        }
        
        .probability-bar {
            margin-top: 15px;
            height: 8px;
            background: rgba(255,107,107,0.3);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .probability-bar .yes {
            height: 100%;
            background: linear-gradient(90deg, #00d4aa, #00f5c4);
            transition: width 0.5s ease;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00d4aa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        footer {
            text-align: center;
            padding: 40px;
            color: #555;
            font-size: 14px;
        }
        
        footer a {
            color: #00d4aa;
            text-decoration: none;
        }
        
        .last-update {
            text-align: right;
            color: #555;
            font-size: 12px;
            margin-bottom: 10px;
        }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .modal h3 {
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .modal-content {
            color: #ccc;
            line-height: 1.6;
        }
        
        .modal-close {
            margin-top: 20px;
            width: 100%;
        }
        
        .outcome-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .outcome-btn {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .outcome-btn.yes {
            background: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
            border: 1px solid #00d4aa;
        }
        
        .outcome-btn.no {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }
        
        .outcome-btn:hover {
            transform: scale(1.02);
        }
        
        @media (max-width: 600px) {
            .search-box {
                flex-direction: column;
            }
            
            .market-header {
                flex-direction: column;
            }
            
            .market-price {
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">📊 <span>Polymarket</span> Dashboard</div>
            <p class="subtitle">Live prediction market data • Auto-refreshes every 60 seconds</p>
        </header>
        
        <div class="stats-row">
            <div class="stat-card">
                <div class="value" id="totalMarkets">-</div>
                <div class="label">Active Markets</div>
            </div>
            <div class="stat-card">
                <div class="value" id="totalLiquidity">-</div>
                <div class="label">Total Liquidity</div>
            </div>
            <div class="stat-card">
                <div class="value" id="totalVolume">-</div>
                <div class="label">Total Volume</div>
            </div>
        </div>
        
        <div class="card">
            <h2>🔥 Trending Markets</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search markets (e.g., Trump, Bitcoin, Fed, Election)...">
                <button class="btn btn-primary" onclick="searchMarkets()">Search</button>
                <button class="btn btn-secondary" onclick="clearSearch()">Clear</button>
            </div>
            
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="politics">Politics</button>
                <button class="filter-tab" data-filter="crypto">Crypto</button>
                <button class="filter-tab" data-filter="sports">Sports</button>
                <button class="filter-tab" data-filter="finance">Finance</button>
            </div>
            
            <div class="last-update">Last updated: <span id="lastUpdate">-</span></div>
            
            <div id="marketList" class="market-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading live market data...
                </div>
            </div>
        </div>
        
        <footer>
            Data from <a href="https://polymarket.com" target="_blank">Polymarket</a> via Gamma API<br>
            Built with ❤️ for prediction markets
        </footer>
    </div>
    
    <!-- Market Detail Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 id="modalTitle">Market Details</h3>
            <div class="modal-content" id="modalContent"></div>
            <div class="outcome-buttons" id="outcomeButtons"></div>
            <button class="btn btn-secondary modal-close" onclick="closeModal()">Close</button>
        </div>
    </div>
    
    <script>
        const GAMMA_API = 'https://gamma-api.polymarket.com';
        let allMarkets = [];
        let currentFilter = 'all';
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadMarkets();
            
            // Auto-refresh every 60 seconds
            setInterval(loadMarkets, 60000);
            
            // Search on Enter
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchMarkets();
            });
            
            // Filter tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.filter;
                    renderMarkets(filterMarkets(allMarkets));
                });
            });
        });
        
        async function loadMarkets() {
            const container = document.getElementById('marketList');
            
            try {
                // Fetch from Gamma API (no auth required)
                const response = await fetch(`${GAMMA_API}/markets?closed=false&active=true&limit=50`);
                const markets = await response.json();
                
                allMarkets = markets;
                
                // Update stats
                updateStats(markets);
                
                // Render markets
                renderMarkets(filterMarkets(markets));
                
                // Update timestamp
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                
            } catch (error) {
                console.error('Failed to load markets:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>Failed to load markets. Please try again.</p>
                        <button class="btn btn-primary" onclick="loadMarkets()" style="margin-top: 15px;">Retry</button>
                    </div>
                `;
            }
        }
        
        function filterMarkets(markets) {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            
            let filtered = markets;
            
            // Apply search filter
            if (searchQuery) {
                filtered = filtered.filter(m => 
                    (m.question || '').toLowerCase().includes(searchQuery) ||
                    (m.description || '').toLowerCase().includes(searchQuery)
                );
            }
            
            // Apply category filter
            if (currentFilter !== 'all') {
                const keywords = {
                    politics: ['trump', 'biden', 'election', 'president', 'senate', 'congress', 'governor', 'vote', 'democrat', 'republican', 'political'],
                    crypto: ['bitcoin', 'btc', 'ethereum', 'eth', 'crypto', 'token', 'blockchain', 'sol', 'solana', 'usdt', 'tether', 'coin'],
                    sports: ['nfl', 'nba', 'mlb', 'soccer', 'football', 'basketball', 'baseball', 'tennis', 'golf', 'super bowl', 'championship'],
                    finance: ['fed', 'rate', 'inflation', 'recession', 'stock', 'market', 'economy', 'gdp', 'interest', 'treasury']
                };
                
                const categoryKeywords = keywords[currentFilter] || [];
                filtered = filtered.filter(m => {
                    const text = ((m.question || '') + ' ' + (m.description || '')).toLowerCase();
                    return categoryKeywords.some(kw => text.includes(kw));
                });
            }
            
            // Sort by liquidity
            filtered.sort((a, b) => parseFloat(b.liquidity || 0) - parseFloat(a.liquidity || 0));
            
            return filtered;
        }
        
        function searchMarkets() {
            renderMarkets(filterMarkets(allMarkets));
        }
        
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            currentFilter = 'all';
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.filter-tab[data-filter="all"]').classList.add('active');
            renderMarkets(allMarkets);
        }
        
        function updateStats(markets) {
            document.getElementById('totalMarkets').textContent = markets.length;
            
            const totalLiquidity = markets.reduce((sum, m) => sum + parseFloat(m.liquidity || 0), 0);
            document.getElementById('totalLiquidity').textContent = formatCurrency(totalLiquidity);
            
            const totalVolume = markets.reduce((sum, m) => sum + parseFloat(m.volume || 0), 0);
            document.getElementById('totalVolume').textContent = formatCurrency(totalVolume);
        }
        
        function renderMarkets(markets) {
            const container = document.getElementById('marketList');
            
            if (!markets || markets.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <p>No markets found matching your criteria</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = markets.slice(0, 30).map(market => {
                const liquidity = formatCurrency(parseFloat(market.liquidity || 0));
                const volume = formatCurrency(parseFloat(market.volume || 0));
                
                // Parse outcome prices
                let yesPrice = 0.5;
                try {
                    const prices = JSON.parse(market.outcomePrices || '[0.5, 0.5]');
                    yesPrice = parseFloat(prices[0]) || 0.5;
                } catch (e) {}
                
                const yesPercent = Math.round(yesPrice * 100);
                const noPercent = 100 - yesPercent;
                
                // Format end date
                let endDate = '';
                if (market.end_date_iso) {
                    const date = new Date(market.end_date_iso);
                    endDate = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                }
                
                return `
                    <div class="market-item" onclick='showMarketDetail(${JSON.stringify(market).replace(/'/g, "\\'")})'>
                        <div class="market-header">
                            <div class="market-question">${escapeHtml(market.question || 'Unknown')}</div>
                            <div class="market-price">${yesPercent}% Yes</div>
                        </div>
                        <div class="market-stats">
                            <span>💰 Liquidity: <span class="value">${liquidity}</span></span>
                            <span>📈 Volume: <span class="value">${volume}</span></span>
                            ${endDate ? `<span>📅 Ends: <span class="value">${endDate}</span></span>` : ''}
                        </div>
                        <div class="probability-bar">
                            <div class="yes" style="width: ${yesPercent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function showMarketDetail(market) {
            const modal = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');
            const buttons = document.getElementById('outcomeButtons');
            
            // Parse prices
            let yesPrice = 0.5, noPrice = 0.5;
            try {
                const prices = JSON.parse(market.outcomePrices || '[0.5, 0.5]');
                yesPrice = parseFloat(prices[0]) || 0.5;
                noPrice = parseFloat(prices[1]) || 0.5;
            } catch (e) {}
            
            title.textContent = market.question || 'Market Details';
            
            content.innerHTML = `
                <p style="margin-bottom: 15px;">${market.description || 'No description available.'}</p>
                <p><strong>Liquidity:</strong> ${formatCurrency(parseFloat(market.liquidity || 0))}</p>
                <p><strong>Volume:</strong> ${formatCurrency(parseFloat(market.volume || 0))}</p>
                ${market.end_date_iso ? `<p><strong>End Date:</strong> ${new Date(market.end_date_iso).toLocaleDateString()}</p>` : ''}
            `;
            
            buttons.innerHTML = `
                <button class="outcome-btn yes" onclick="window.open('https://polymarket.com/event/${market.slug || ''}', '_blank')">
                    Yes @ ${Math.round(yesPrice * 100)}¢
                </button>
                <button class="outcome-btn no" onclick="window.open('https://polymarket.com/event/${market.slug || ''}', '_blank')">
                    No @ ${Math.round(noPrice * 100)}¢
                </button>
            `;
            
            modal.classList.add('active');
        }
        
        function closeModal(event) {
            if (!event || event.target.id === 'modalOverlay') {
                document.getElementById('modalOverlay').classList.remove('active');
            }
        }
        
        function formatCurrency(value) {
            if (value >= 1000000) {
                return '$' + (value / 1000000).toFixed(1) + 'M';
            } else if (value >= 1000) {
                return '$' + (value / 1000).toFixed(0) + 'K';
            }
            return '$' + Math.round(value);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
        
        // Close modal on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
