[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "0.1.0"
description = "Maker-side Polymarket trading bot, plus a toolkit for profiling the traders who actually make money"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "py-clob-client>=0.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
polybot = "polybot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
