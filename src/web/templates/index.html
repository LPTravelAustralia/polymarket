<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Trading Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo span {
            color: #00d4aa;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status-badge.running {
            background: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
            border: 1px solid #00d4aa;
        }
        
        .status-badge.stopped {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }
        
        @media (max-width: 1000px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
        }
        
        .search-box input::placeholder {
            color: #888;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #00d4aa;
            color: #000;
        }
        
        .btn-primary:hover {
            background: #00f5c4;
        }
        
        .btn-danger {
            background: #ff6b6b;
            color: #fff;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        .market-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .market-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .market-item:hover {
            background: rgba(255,255,255,0.1);
            border-color: #00d4aa;
        }
        
        .market-question {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .market-stats {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #888;
        }
        
        .market-stats span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .market-stats .value {
            color: #00d4aa;
        }
        
        .probability-bar {
            margin-top: 12px;
            height: 6px;
            background: rgba(255,107,107,0.3);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .probability-bar .yes {
            height: 100%;
            background: #00d4aa;
            transition: width 0.3s;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        .controls .btn {
            flex: 1;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            background: rgba(255,255,255,0.05);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #00d4aa;
        }
        
        .stat-item .label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .log-container {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .log-entry {
            padding: 4px 0;
            color: #888;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00d4aa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                🤖 <span>Polymarket</span> Trading Bot
            </div>
            <div id="statusBadge" class="status-badge stopped">
                ● Stopped
            </div>
        </header>
        
        <div class="grid">
            <div class="main-content">
                <div class="card">
                    <h2>📊 Live Markets</h2>
                    
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search markets (e.g., Trump, Bitcoin, Fed)...">
                        <button class="btn btn-primary" onclick="searchMarkets()">Search</button>
                        <button class="btn btn-secondary" onclick="loadMarkets()">Refresh</button>
                    </div>
                    
                    <div id="marketList" class="market-list">
                        <div class="loading">
                            <div class="spinner"></div>
                            Loading markets...
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="card">
                    <h2>🎮 Bot Controls</h2>
                    
                    <div class="controls">
                        <button class="btn btn-primary" onclick="startBot()">▶ Start</button>
                        <button class="btn btn-danger" onclick="stopBot()">⏹ Stop</button>
                    </div>
                </div>
                
                <div class="card">
                    <h2>📈 Statistics</h2>
                    
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="value" id="tradesToday">0</div>
                            <div class="label">Trades Today</div>
                        </div>
                        <div class="stat-item">
                            <div class="value" id="totalPnl">$0.00</div>
                            <div class="label">Total P&L</div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <h2>📋 Activity Log</h2>
                    
                    <div id="logContainer" class="log-container">
                        <div class="log-entry">Bot initialized...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let botRunning = false;
        
        // Load markets on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadMarkets();
            updateStatus();
            
            // Auto-refresh every 30 seconds
            setInterval(loadMarkets, 30000);
            setInterval(updateStatus, 5000);
        });
        
        // Handle Enter key in search
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchMarkets();
        });
        
        async function loadMarkets() {
            const container = document.getElementById('marketList');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading markets...</div>';
            
            try {
                const response = await fetch('/api/markets?limit=15');
                const data = await response.json();
                
                if (data.success) {
                    renderMarkets(data.markets);
                } else {
                    container.innerHTML = '<div class="empty-state">Failed to load markets</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="empty-state">Error connecting to server</div>';
            }
        }
        
        async function searchMarkets() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                loadMarkets();
                return;
            }
            
            const container = document.getElementById('marketList');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';
            
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.success) {
                    renderMarkets(data.markets);
                } else {
                    container.innerHTML = '<div class="empty-state">No results found</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="empty-state">Search failed</div>';
            }
        }
        
        function renderMarkets(markets) {
            const container = document.getElementById('marketList');
            
            if (!markets || markets.length === 0) {
                container.innerHTML = '<div class="empty-state">No markets found</div>';
                return;
            }
            
            container.innerHTML = markets.map(market => {
                const liquidity = formatCurrency(market.liquidity);
                const volume = formatCurrency(market.volume);
                
                // Parse outcome prices
                let yesPrice = 0.5;
                try {
                    const prices = JSON.parse(market.outcome_prices || '[0.5, 0.5]');
                    yesPrice = parseFloat(prices[0]) || 0.5;
                } catch (e) {}
                
                const yesPercent = Math.round(yesPrice * 100);
                
                return `
                    <div class="market-item" onclick="analyzeMarket('${market.id}', '${escapeHtml(market.question)}')">
                        <div class="market-question">${escapeHtml(market.question)}</div>
                        <div class="market-stats">
                            <span>💰 <span class="value">${liquidity}</span></span>
                            <span>📈 <span class="value">${volume}</span></span>
                            <span>Yes: <span class="value">${yesPercent}%</span></span>
                        </div>
                        <div class="probability-bar">
                            <div class="yes" style="width: ${yesPercent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function startBot() {
            try {
                const response = await fetch('/api/bot/start', { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    updateStatus();
                }
            } catch (error) {
                console.error('Failed to start bot:', error);
            }
        }
        
        async function stopBot() {
            try {
                const response = await fetch('/api/bot/stop', { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    updateStatus();
                }
            } catch (error) {
                console.error('Failed to stop bot:', error);
            }
        }
        
        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                botRunning = data.running;
                
                // Update status badge
                const badge = document.getElementById('statusBadge');
                if (data.running) {
                    badge.className = 'status-badge running';
                    badge.textContent = '● Running';
                } else {
                    badge.className = 'status-badge stopped';
                    badge.textContent = '● Stopped';
                }
                
                // Update stats
                document.getElementById('tradesToday').textContent = data.trades_today;
                document.getElementById('totalPnl').textContent = formatCurrency(data.total_pnl, true);
                
                // Update log
                const logContainer = document.getElementById('logContainer');
                if (data.messages && data.messages.length > 0) {
                    logContainer.innerHTML = data.messages
                        .map(msg => `<div class="log-entry">${escapeHtml(msg)}</div>`)
                        .join('');
                }
                
            } catch (error) {
                console.error('Failed to update status:', error);
            }
        }
        
        async function analyzeMarket(marketId, question) {
            try {
                const response = await fetch('/api/bot/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ market_id: marketId, question: question })
                });
                const data = await response.json();
                
                if (data.success) {
                    alert(`Analysis for: ${question}\n\n` +
                          `Recommendation: ${data.analysis.recommendation}\n` +
                          `Confidence: ${Math.round(data.analysis.confidence * 100)}%\n` +
                          `Predicted: ${Math.round(data.analysis.predicted_probability * 100)}%\n\n` +
                          `${data.analysis.reasoning}`);
                }
                
                updateStatus();
            } catch (error) {
                console.error('Analysis failed:', error);
            }
        }
        
        function formatCurrency(value, showSign = false) {
            const num = parseFloat(value) || 0;
            const formatted = new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(Math.abs(num));
            
            if (showSign && num !== 0) {
                return num >= 0 ? `+${formatted}` : `-${formatted}`;
            }
            return formatted;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
